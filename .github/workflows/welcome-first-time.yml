name: Welcome First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 **Welcome to the Agent Skills Directory!**

            Thanks for opening your first issue. A maintainer will review it soon.
            If you're suggesting a skill, please include your real-world experience with the procedure — that's our quality bar.

            New here? [CONTRIBUTING.md](https://github.com/aniruddhaadak80/skills/blob/main/CONTRIBUTING.md) has everything you need.
          pr-message: |
            🎉 **Congratulations on your first pull request!**

            Our automated reviewer is already checking:
            - Knowledge-base QA validation
            - Generated-files sync (run `npm run gen` if flagged)
            - Website build + route integrity

            A human will review shortly. Thank you for contributing to the open agent skills ecosystem! ⚡
