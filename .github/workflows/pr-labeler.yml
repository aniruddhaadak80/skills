name: PR Labels

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const paths = files.map(f => f.filename);
            const labels = new Set();
            if (paths.some(p => p.startsWith('src/data/tracks/') || p.startsWith('src/lib/skills'))) labels.add('knowledge-base');
            if (paths.some(p => p.startsWith('skills/'))) labels.add('skill-content');
            if (paths.some(p => p.startsWith('src/app') || p.startsWith('src/components'))) labels.add('website');
            if (paths.some(p => p.endsWith('.yml') && p.includes('.github/workflows'))) labels.add('ci-automation');
            if (paths.some(p => p === 'README.md' || p.startsWith('.github')) && !paths.some(p => p.startsWith('src'))) labels.add('documentation');
            const existing = context.payload.pull_request.labels.map(l => l.name);
            const toAdd = [...labels].filter(l => !existing.includes(l));
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: toAdd
              });
            }
